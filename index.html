// ===== SUBJECT DETECTOR =====
function extractSubject(filename) {
    if (filename.includes('COMBINEDSUBJECT')) return 'Combined Subject';
    if (filename.includes('ADVANCEMATH') || filename.includes('ADVMATH')) return 'Advanced Maths';
    if (filename.includes('GENERALMATH')) return 'General Maths';
    if (filename.includes('MATH')) return 'Mathematics';
    if (filename.includes('ENGLISH')) return 'English';
    if (filename.includes('SOCIALSCIENCE')) return 'Social Science';
    if (filename.includes('SCIENCE')) return 'Science';
    if (filename.includes('APPLIEDSCIENCE')) return 'Applied Science';
    if (filename.includes('CHEMISTRY')) return 'Chemistry';
    if (filename.includes('PHYSIC')) return 'Physics';
    if (filename.includes('BIOLOGY')) return 'Biology';
    if (filename.includes('GEOGRAPHY')) return 'Geography';
    if (filename.includes('GEOLOGY')) return 'Geology';
    if (filename.includes('HISTORY') || filename.includes('HISTROY')) return 'History';
    if (filename.includes('ICT')) return 'ICT';
    if (filename.includes('COMPUTING')) return 'Computing';
    if (filename.includes('BUSINESS')) return 'Business Studies';
    if (filename.includes('ACCOUNTING')) return 'Accounting';
    if (filename.includes('ECONOMICS')) return 'Economics';
    if (filename.includes('LEGAL')) return 'Legal Studies';
    if (filename.includes('LANGUAGE') || filename.includes('LANGUAGELITERATURE')) return 'Language & Literature';
    if (filename.includes('APPLIEDENGLISH')) return 'Applied English';
    if (filename.includes('AGRICULTURE') || filename.includes('AGRICULUTRE')) return 'Agriculture';
    if (filename.includes('ARTS')) return 'Arts';
    if (filename.includes('DESIGNTECH')) return 'Design Technology';
    if (filename.includes('HOMEECONOMIC')) return 'Home Economics';
    if (filename.includes('PERSONAL')) return 'Personal Development';
    if (filename.includes('PRACTICALSKILLS') || filename.includes('PSEXAM')) return 'Practical Skills';
    return 'Exam Paper';
}

// ===== IMPORTANT: FIXED PATH FUNCTION =====
function createPaperLink(grade, year, filename) {
    let folderPath = "";

    // MATCHES YOUR REAL FOLDER STRUCTURE EXACTLY
    if (grade === "grade8") {
        // C:\Exam Prep Web\GRADE8\2010GRADE8EXAM\
        folderPath = `GRADE8/${year}GRADE8EXAM/${filename}`;
    }
    else if (grade === "grade10") {
        // C:\Exam Prep Web\GRADE10\2014EXAMPAPERS\
        folderPath = `GRADE10/${year}EXAMPAPERS/${filename}`;
    }
    else if (grade === "grade12") {
        // C:\Exam Prep Web\GRADE12\2014EXAMPAPERS\
        folderPath = `GRADE12/${year}EXAMPAPERS/${filename}`;
    }

    const subject = extractSubject(filename);
    const icon = getIcon(subject);

    return `
        <a href="${folderPath}" target="_blank"
           class="paper-link flex items-center justify-between p-2 rounded border border-gray-200 text-sm">
            <div class="flex items-center">
                <i class="${icon} mr-2 text-blue-500"></i>
                <span class="font-medium">${subject}</span>
            </div>
            <i class="fas fa-external-link-alt text-gray-400 text-xs"></i>
        </a>
    `;
}

// ===== LOAD CONTENT =====
function loadGradeContent(gradeId, data) {
    const container = document.getElementById(`${gradeId}-content`);
    const years = Object.keys(data.years).sort();

    let html = '';

    years.forEach((year, index) => {
        const papers = data.years[year];

        html += `<h3 class="font-bold mt-4 mb-2">${year}</h3>`;

        if (papers.length === 0) {
            html += `<p class="text-gray-500 text-sm">No papers found</p>`;
        } else {
            papers.forEach(file => {
                html += createPaperLink(gradeId, year, file);
            });
        }
    });

    container.innerHTML = html;
}

    loadGradeContent("grade8", examPapers.grade8);
    loadGradeContent("grade10", examPapers.grade10);
    loadGradeContent("grade12", examPapers.grade12);
}
